name: CI / Build & Test

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edo_db
          POSTGRES_USER: edo_user
          POSTGRES_PASSWORD: edo_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Run Backend Tests
        run: ./gradlew test --no-daemon
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/edo_db
          SPRING_DATASOURCE_USERNAME: edo_user
          SPRING_DATASOURCE_PASSWORD: edo_password
          JWT_SECRET: ci_test_secret_key_ci_test_secret_key_ci_test_secret_key_12345
          JWT_EXPIRATION_MS: 86400000

      - name: Build Executable Boot Jar
        run: ./gradlew bootJar -x test --no-daemon
        working-directory: backend

  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeCheck & Build Frontend
        run: npm run build
        working-directory: frontend
